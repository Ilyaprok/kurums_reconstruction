е горы</span><span class="ks-step" data-step="2"><b>3</b>Пенеплен</span><span class="ks-step" data-step="3"><b>4</b>Надвиг и поднятие</span><span class="ks-step" data-step="4"><b>5</b>Морозное выветривание</span><span class="ks-step" data-step="5"><b>6</b>Каменная река</span><span class="ks-step" data-step="6"><b>7</b>Голоцен: сегодня</span></div><div class="ks-title">Дно Уральского океана</div><p class="ks-text">Реки сносят на шельф океана кварцевый песок — будущий кварцит. Плиты с двух сторон уже сдавливают океан, и с этого момента тиски давят постоянно.</p></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Кровля кварцита и движущиеся глыбы</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Глинистые сланцы и глины, основание и лес</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Тиски: слева (запад) Восточно-Европейская плита, справа (восток) Сибирская и Казахстанская</span><span class="iso-key"><svg class="iso-swatch" data-mark="solid" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Жирная линия на срезе — надвиг: западный блок вышел наверх, восточный ушёл вниз</span></span><span class="iso-caption">Схема по материалам серии постов о каменных реках Южного Урала; асимметрия хребта (надвиг западного блока на восточный и обрушение нависания на восток) — по схеме автора. Масштаб: одно деление линейки 100 м, глыбы показаны крупнее, чем в природе (на самом деле 0,5–3 м). Возраст курумов Южного Урала прямо не датирован, указаны наиболее принятые оценки.</span></figcaption></figure></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];
        });
        const insetTop = inset.map(([x, y]) => iso([x, y, z + height], projection));
        bevel = runsOf(facing, true)
            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))
            .join("");
    }
    return {
        fill,
        outline: outline.join(""),
        crease: crease.join(""),
        top: pathOf(oriented(top), true),
        shades: buckets.map((paths) => paths.join("")),
        bevel,
    };
}
const ringOf = (plan, steps = 8) => roundedPlan(plan, steps);
function slabOf(plan, z, height, projection, steps = 8, bevel = 0) {
    return extrude(ringOf(plan, steps), z, height, projection, { convex: true, bevel });
}
function circleRing(cx, cy, radius, steps = 40) {
    return Array.from({ length: steps }, (_, step) => {

        const tx = x + (random() - 0.5) * 7;
        const ty = y + (random() - 0.5) * 7;
        if (Math.abs(ty) > Y0 - 3 || Math.abs(tx) > X0 - 3) continue;
        const f = field(tx, ty, FINAL);
        if (f.mat !== "s" || f.debris > 0.3) continue;
        if (tx > CREST - 4 && tx < CREST + 10) continue;
        TREES.push({ x: tx, y: ty, size: 0.8 + random() * 0.45, born: random() * 0.7 });
      }
    }
    for (const I of ISLANDS) {
      for (let n = 0; n < 4; n++) {
        const a = random() * Math.PI * 2;
        const r = random() * (I.r - 1.5);
        TREES.push({ x: I.x + Math.cos(a) * r, y: I.y + Math.sin(a) * r, size: 0.65 + random() * 0.3, born: 0.35 + random() * 0.5 });
      }
    }
  }

  const FINES = [];
  {
    const random = rng(55);
    for (let n = 0; n < 220; n++) {
      const start = LOGS[0].y;
      FINES.push({ x: VALLEY.x + (random() - 0.5) * 2 * VALLEY.w * 0.8, y: start + random() * (Y0 - 4 - start), born: random() * 0.8, sink: random() * 0.55 });
    }
  }

  const { sinA, cosA } = { sinA: Math.sin((P.azimuth * Math.PI) / 180), cosA: Math.cos((P.azimuth * Math.PI) / 180) };
  const LIGHT = (() => {
    const v = [-sinA * 0.7, cosA * 0.7, 1.1];
    const n = Math.hypot(...v);
    return v.map((c) => c / n);
  })();
  const VIEW = [cosA, sinA];

  const at = (p) => k.iso(p, P);
  const depth = (x, y) => k.depthOf([x, y, 0], P);

  function hull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const p of sorted) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
      lower.push(p);
    }
    const upper = [];
    for (let i = sorted.length - 1; i >= 0; i--) {
      const p = sorted[i];
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
      upper.push(p);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
  }

  function cone(x, y, z, r, height) {
    const N = 16;
    const angles = Array.from({ length: N }, (_, n) => (n / N) * Math.PI * 2);
    const base = angles.map((a) => at([x + r * Math.cos(a), y + r * Math.sin(a), z]));
    const apex = at([x, y, z + height]);
    const outline = k.pathOf(hull([apex, ...base]), true);
    const dark = angles.map((a) => Math.cos(a) * -sinA + Math.sin(a) * cosA < 0 && Math.cos(a) * VIEW[0] + Math.sin(a) * VIEW[1] > -0.05);
    const start = dark.findIndex((d, n) => d && !dark[(n + N - 1) % N]);
    const arc = [];
    if (start >= 0) for (let n = start; dark[n % N] && arc.length < N; n++) arc.push(base[n % N]);
    const shade = arc.length > 1 ? k.pathOf([apex, ...arc], true) : "";
    return { outline, shade };
  }

  function treeSvg(tree, z, grow) {
    const s = tree.size * (0.25 + 0.75 * grow);
    const lower = cone(tree.x, tree.y, z + 0.9 * s, 2.6 * s, 4.6 * s);
    const upper = cone(tree.x, tree.y, z + 3.4 * s, 1.8 * s, 3.8 * s);
    const trunk = k.pathOf([at([tree.x, tree.y, z]), at([tree.x, tree.y, z + 1.2 * s])]);
    const part = (c) => `<path class="ks-tf" d="${c.outline}"/>${c.shade ? `<path class="ks-ts" d="${c.shade}"/>` : ""}<path class="iso-line" data-tone="mid" d="${c.outline}"/>`;
    return `<g class="ks-tree"${grow < 1 ? ` opacity="${Math.min(1, grow * 2.5).toFixed(2)}"` : ""}><path class="iso-line" data-tone="mid" d="${trunk}"/>${part(lower)}${part(upper)}</g>`;
  }

  function stoneSvg(ring, x, y, z, height, c, lit) {
    const world = ring.map(([lx, ly]) => [(x + lx) * c, y + ly]);
    return k.solidSvg(k.extrude(world, z, height, P, { convex: true, bevel: 0.35 }), { tone: "hi", crease: "lo", lit });
  }

  function marching(hs, xs, ys, step) {
    const [h00, h10, h11, h01] = hs;
    const lo = Math.min(...hs);
    const hi = Math.max(...hs);
    const out = [];
    for (let level = Math.ceil(lo / step) * step; level < hi; level += step) {
      const points = [];
      const edge = (ha, hb, pa, pb) => {
        if ((ha < level) === (hb < level)) return;
        const t = (level - ha) / (hb - ha);
        points.push(at([lerp(pa[0], pb[0], t), lerp(pa[1], pb[1], t), level]));
      };
      const c00 = [xs[0], ys[0]];
      const c10 = [xs[1], ys[0]];
      const c11 = [xs[1], ys[1]];
      const c01 = [xs[0], ys[1]];
      edge(h00, h10, c00, c10);
      edge(h10, h11, c10, c11);
      edge(h11, h01, c11, c01);
      edge(h01, h00, c01, c00);
      for (let n = 0; n + 1 < points.length; n += 2) out.push(k.pathOf([points[n], points[n + 1]]));
    }
    return out.join("");
  }

  function bedOf() {
    return false;
  }

  function terrain(S, c, items) {
    const grid = [];
    for (let i = 0; i <= NX; i++) {
      const column = [];
      for (let j = 0; j <= NY; j++) column.push(field(-X0 + i * DX, -Y0 + j * DY, S));
      grid.push(column);
    }
    const hAt = (i, j) => grid[Math.max(0, Math.min(NX, i))][Math.max(0, Math.min(NY, j))].h;
    const shine = grid.map((column, i) =>
      column.map((_, j) => {
        const n = [-(hAt(i + 1, j) - hAt(i - 1, j)) / (2 * DX * c), -(hAt(i, j + 1) - hAt(i, j - 1)) / (2 * DY), 1];
        return (n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]) / Math.hypot(...n);
      }),
    );
    for (let i = 0; i < NX; i++) {
      for (let j = 0; j < NY; j++) {
        const x0 = (-X0 + i * DX) * c;
        const x1 = (-X0 + (i + 1) * DX) * c;
        const y0 = -Y0 + j * DY;
        const y1 = y0 + DY;
        const f = [grid[i][j], grid[i + 1][j], grid[i + 1][j + 1], grid[i][j + 1]];
        const hs = f.map((v) => v.h);
        const quartzCorners = f.filter((v) => v.mat === "q").length;
        const rock = quartzCorners >= 3 || (quartzCorners >= 1 && Math.max(...hs) - Math.min(...hs) > 6);
        const quartz = rock || f.filter((v) => v.mat === "k").length >= 2;
        const lambert = (shine[i][j] + shine[i + 1][j] + shine[i + 1][j + 1] + shine[i][j + 1]) / 4;
        const levels = quartz ? 6 : 16;
        const level = Math.max(0, Math.min(levels - 1, Math.floor(((lambert - 0.6) / 0.4) * levels)));
        const d = k.pathOf([at([x0, y0, hs[0]]), at([x1, y0, hs[1]]), at([x1, y1, hs[2]]), at([x0, y1, hs[3]])], true);
        const lines = [];
        const contour = marching(hs, [x0, x1], [y0, y1], 5);
        if (contour) lines.push({ tone: quartz ? "lo" : "faint", d: contour });
        if (rock && S.frost > 0.02) {
          const joint = [];
          if (i % 2 === 0) joint.push(k.pathOf([at([x0, y0, hs[0]]), at([x0, y1, hs[3]])]));
          if ((j + (i >> 1)) % 2 === 0) joint.push(k.pathOf([at([x0, y0, hs[0]]), at([x1, y0, hs[1]])]));
          if (joint.length) lines.push({ tone: "mid", alpha: Math.min(1, S.frost * 1.6), d: joint.join("") });
        }
        items.push({ key: depth((x0 + x1) / 2, (y0 + y1) / 2), cell: quartz ? `q${level}` : `s${level}`, d, lines });
      }
    }
    return grid;
  }

  function faces(S, c, grid) {
    const out = [];
    const FINE = 4;
    const sections = [
      { name: "f", points: Array.from({ length: NX * FINE + 1 }, (_, i) => { const x = -X0 + (i * DX) / FINE; return { p: [x * c, Y0], f: field(x, Y0, S) }; }) },
      { name: "s", points: Array.from({ length: NY * FINE + 1 }, (_, j) => { const y = -Y0 + (j * DY) / FINE; return { p: [X0 * c, y], f: field(X0, y, S) }; }) },
    ];
    const blocks = {
      fw: (f) => ({ from: 0, top: Math.max(0, f.fw.top), b: f.fw.b, q: f.fw.q, c: f.fw.c, deb: f.hw ? 0 : f.debris, on: f.fw.top > -1.5 }),
      hw: (f) => (f.hw ? { ...f.hw, on: true } : { from: f.h, top: f.h, b: 0, q: 0, c: 0, on: false }),
    };
    const clampIn = (v, B) => Math.min(Math.max(v, B.from), B.top);
    for (const section of sections) {
      const pts = section.points;
      const pt = (p, z) => at([p[0], p[1], z]);
      let hollow = [];
      const shade = () => {
        if (hollow.length > 1) {
          const top = hollow.map(({ p, f }) => pt(p, f.hw.from));
          const bottom = hollow.map(({ p, f }) => pt(p, Math.max(0, f.fw.top) + f.debris)).reverse();
          out.push(`<path class="ks-face" data-m="cav" d="${k.pathOf([...top, ...bottom], true)}"/>`);
        }
        hollow = [];
      };
      for (const sample of pts) {
        if (sample.f.hw && sample.f.hw.from > sample.f.fw.top + sample.f.debris + 0.05) hollow.push(sample);
        else shade();
      }
      shade();
      for (const [key, of] of Object.entries(blocks)) {
        const cols = pts.map(({ p, f }) => ({ p, B: of(f) }));
        const runs = [];
        let run = [];
        for (const col of cols) {
          if (col.B.on) run.push(col);
          else {
            if (run.length > 1) runs.push(run);
            run = [];
          }
        }
        if (run.length > 1) runs.push(run);
        for (const r of runs) {
          const band = (lower, upper, cls) => {
            const top = r.map(({ p, B }) => pt(p, upper(B)));
            const bottom = r.map(({ p, B }) => pt(p, lower(B))).reverse();
            out.push(`<path class="ks-face" data-m="${cls}${section.name}" d="${k.pathOf([...top, ...bottom], true)}"/>`);
          };
          band((B) => B.from, (B) => clampIn(B.b, B), "b");
          band((B) => clampIn(B.b, B), (B) => clampIn(B.q, B), "q");
          band((B) => clampIn(B.q, B), (B) => clampIn(B.c, B), "s");
          band((B) => clampIn(B.c, B), (B) => B.top, "c");
          const line = (zOf) => {
            const paths = [];
            let chain = [];
            for (let i = 0; i < r.length; i++) {
              const inside = (n) => n >= 0 && n < r.length && zOf(r[n].B) > r[n].B.from + 0.05 && zOf(r[n].B) < r[n].B.top - 0.05;
              if (inside(i) || inside(i - 1) || inside(i + 1)) chain.push(pt(r[i].p, clampIn(zOf(r[i].B), r[i].B)));
              else {
                if (chain.length > 1) paths.push(k.pathOf(chain));
                chain = [];
              }
            }
            if (chain.length > 1) paths.push(k.pathOf(chain));
            return paths.join("");
          };
          const bedding = [];
          for (let n = 1; n <= 6; n++) bedding.push(line((B) => Math.min(B.q + n * 3.6, B.c)));
          for (const share of [1 / 3, 2 / 3]) bedding.push(line((B) => lerp(B.b, B.q, share)));
          bedding.push(line((B) => B.b - 6));
          out.push(k.lineSvg(bedding.join(""), { tone: "faint" }));
          out.push(k.lineSvg(line((B) => B.c), { tone: "lo" }));
          const joints = [];
          r.forEach(({ p, B }, n) => {
            if (n % FINE || n === 0 || n === r.length - 1) return;
            const step = n / FINE;
            const share = step % 2 ? [0, 1 / 3] : step % 4 === 0 ? [1 / 3, 2 / 3] : [2 / 3, 1];
            const z0 = clampIn(lerp(B.b, B.q, share[0]), B);
            const z1 = clampIn(lerp(B.b, B.q, share[1]), B);
            if (z1 - z0 > 1) joints.push(k.pathOf([pt(p, z0), pt(p, z1)]));
          });
          if (S.fold > 0.02) out.push(`<g opacity="${Math.min(1, S.fold * 1.5).toFixed(2)}">${k.lineSvg(joints.join(""), { tone: "lo" })}</g>`);
          out.push(k.lineSvg(line((B) => B.b), { tone: "mid" }));
          out.push(k.lineSvg(line((B) => B.q), { tone: "lit" }));
          if (key === "fw" && r.some(({ B }) => B.deb > 0.05)) band((B) => B.top, (B) => B.top + B.deb, "k");
          out.push(k.lineSvg(k.pathOf(r.map(({ p, B }) => pt(p, B.top + (B.deb || 0)))), { tone: "hi" }));
          if (key === "hw") {
            const fault = k.pathOf(r.map(({ p, B }) => pt(p, B.from)));
            out.push(`<g opacity="${Math.min(1, S.up * 3).toFixed(2)}"><path class="iso-line" data-tone="hi" style="stroke-width:1.4" d="${fault}"/></g>`);
            const ends = [r[0], r[r.length - 1]].filter(({ B }) => B.top - B.from > 0.1);
            out.push(k.lineSvg(ends.map(({ p, B }) => k.pathOf([pt(p, B.from), pt(p, B.top)])).join(""), { tone: "hi" }));
          } else out.push(k.lineSvg(k.pathOf(r.map(({ p }) => pt(p, 0))), { tone: "hi" }));
        }
      }
    }
    const edge = (x, y, h) => k.lineSvg(k.pathOf([at([x, y, 0]), at([x, y, h])]), { tone: "hi" });
    out.push(edge(-X0 * c, Y0, grid[0][NY].h), edge(X0 * c, Y0, grid[NX][NY].h), edge(X0 * c, -Y0, grid[NX][0].h));
    return out.join("");
  }

  function oceanLevel(S) {
    const drain = sm(0, 0.6, S.p[1]);
    return { fade: 1 - drain, level: lerp(46, 36, drain) };
  }

  function ocean(S, c, grid) {
    const { fade, level } = oceanLevel(S);
    if (fade <= 0.01) return "";
    const X = X0 * c;
    const top = k.pathOf([[-X, -Y0], [X, -Y0], [X, Y0], [-X, Y0]].map(([x, y]) => at([x, y, level])), true);
    const front = k.pathOf([...grid.map((col, i) => at([(-X0 + i * DX) * c, Y0, Math.min(level, col[NY].h)])), at([X, Y0, level]), at([-X, Y0, level])], true);
    const side = k.pathOf([...grid[NX].map((f, j) => at([X, -Y0 + j * DY, Math.min(level, f.h)])), at([X, Y0, level]), at([X, -Y0, level])], true);
    const ripples = [-36, -12, 12, 36].map((y) => k.pathOf([at([-X, y, level]), at([X, y, level])])).join("");
    const rim = k.pathOf([at([-X, Y0, level]), at([X, Y0, level]), at([X, -Y0, level])]);
    return `<g opacity="${fade.toFixed(2)}"><path class="ks-water" data-s="side" d="${side}"/><path class="ks-water" data-s="front" d="${front}"/><path class="ks-water" data-s="top" d="${top}"/>${k.lineSvg(ripples, { tone: "faint" })}${k.lineSvg(rim, { tone: "mid" })}</g>`;
  }

  function frustum(x, y, z, r, h, rt) {
    const N = 20;
    const angles = Array.from({ length: N }, (_, n) => (n / N) * Math.PI * 2);
    const base = angles.map((a) => at([x + r * Math.cos(a), y + r * Math.sin(a), z]));
    const rim = angles.map((a) => at([x + rt * Math.cos(a), y + rt * Math.sin(a), z + h]));
    const outline = k.pathOf(hull([...base, ...rim]), true);
    const dark = angles.map((a) => Math.cos(a) * -sinA + Math.sin(a) * cosA < 0 && Math.cos(a) * VIEW[0] + Math.sin(a) * VIEW[1] > -0.05);
    const start = dark.findIndex((d, n) => d && !dark[(n + N - 1) % N]);
    const arc = [];
    if (start >= 0) for (let n = start; dark[n % N] && arc.length < N; n++) arc.push(n % N);
    const shade = arc.length > 1 ? k.pathOf([...arc.map((n) => base[n]), ...arc.map((n) => rim[n]).reverse()], true) : "";
    return { outline, shade, crater: k.pathOf(rim, true), rim };
  }

  function volcanoLife(S) {
    const decay = 1 - sm(0, 0.45, S.p[2]);
    return { grow: sm(0, 0.35, S.p[1]) * decay, decay, erupt: sm(0.05, 0.2, S.p[1]) * (1 - sm(0.05, 0.3, S.p[2])) };
  }

  function volcanoSvg(v, S, c, from) {
    const { grow, decay } = volcanoLife(S);
    const z = sampleH(v.x, v.y, S) - 1;
    const h = v.h * grow;
    const top = z + h;
    const r = v.r * decay;
    const rt = r * 0.2;
    const z0 = Math.max(z, from);
    if (h < 1 || r < 2 || top - z0 < 0.5) return "";
    const r0 = lerp(r, rt, (z0 - z) / h);
    const f = frustum(v.x * c, v.y, z0, r0, top - z0, rt);
    return `<g class="ks-volcano"><path class="ks-vf" d="${f.outline}"/>${f.shade ? `<path class="ks-vs" d="${f.shade}"/>` : ""}<path class="ks-vc" d="${f.crater}"/><path class="iso-line" data-tone="mid" d="${f.outline}"/><path class="iso-line" data-tone="lo" d="${f.crater}"/></g>`;
  }

  function volcanoes(S, c, items) {
    if (volcanoLife(S).grow <= 0) return;
    for (const v of VOLCANOES) items.push({ key: depth(v.x * c, v.y) + 0.2, svg: volcanoSvg(v, S, c, -Infinity) });
  }

  // drawn over the water: the emerged part of each cone, lava and the ash plume
  function eruptions(S, c) {
    const { grow, erupt } = volcanoLife(S);
    if (grow <= 0) return "";
    const { fade, level } = oceanLevel(S);
    const out = [];
    VOLCANOES.forEach((v, index) => {
      if (fade > 0.01) out.push(volcanoSvg(v, S, c, level));
      if (erupt <= 0.01) return;
      const z = sampleH(v.x, v.y, S) - 1 + v.h * grow;
      const rt = v.r * 0.2;
      const lava = [0.15, 0.45, 0.8].map((a) => {
        const ang = Math.atan2(VIEW[1], VIEW[0]) + (a - 0.5) * 1.6;
        const run = (v.r - rt) * (0.35 + 0.25 * Math.sin(S.T * 9 + index + a * 5)) * erupt;
        const pts = [0, 0.5, 1].map((t) => {
          const rr = rt + run * t;
          return at([(v.x + Math.cos(ang) * rr) * c, v.y + Math.sin(ang) * rr, z - (v.h * grow * run * t) / (v.r - rt) + 0.3]);
        });
        return k.pathOf(pts);
      });
      out.push(`<g opacity="${erupt.toFixed(2)}"><path class="ks-lava" d="${lava.join("")}"/></g>`);
      const puffs = [];
      for (let n = 0; n < 7; n++) {
        const ph = (S.T * 4.5 + n / 7 + index * 0.13) % 1;
        const [sx, sy] = at([(v.x + ph * 8) * c, v.y, z + 1.5 + ph * 24]);
        const r = 2.5 + ph * 8;
        puffs.push(`<circle class="ks-ash" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${r.toFixed(1)}" opacity="${(erupt * (1 - ph) * 0.85).toFixed(2)}"/>`);
      }
      out.push(puffs.join(""));
    });
    return out.join("");
  }

  function sampleH(x, y, S) {
    return field(x, y, S).h;
  }

  function stones(S, c, items) {
    let loose = 0;
    let moving = 0;
    let settled = 0;
    const flow = S.flow;
    for (const block of BLOCKS) {
      if (S.u < block.uBorn) continue;
      loose++;
      const fall = sm(block.uBorn, block.uBorn + 0.025, S.u);
      const travel = sm(block.leave, block.leave + block.span, S.u);
      // a quick roll down the gully, then a slow creep along the valley
      const roll = sm(0, 0.22, travel);
      const creep = sm(0.22, 1, travel);
      const x = lerp(lerp(block.from[0], block.mid[0], roll), block.to[0], creep);
      const y = lerp(lerp(block.from[1], block.mid[1], roll), block.to[1], creep);
      const ground = sampleH(x, y, S);
      const active = travel > 0 && travel < 1;
      if (active) moving++;
      else if (travel >= 1) settled++;
      const heave = 0.4 * Math.sin((flow * 9 + block.phase) * Math.PI * 2) * (active ? 1 : 0.2) * (1 - S.forest);
      const drop = (1 - fall) * (1 - fall) * Math.max(0, block.roof - ground);
      const z = ground - 0.7 + heave + drop;
      items.push({ key: depth(x * c, y) + 0.05, svg: stoneSvg(block.ring, x, y, z, block.height, c, active || fall < 1) });
    }
    return { loose, moving, settled };
  }

  function tors(S, c, items) {
    const show = sm(0.55, 1, S.ero);
    if (show <= 0) return;
    for (const tor of TORS) {
      const ground = sampleH(tor.x, tor.y, S);
      let z = ground - 1.2 - (1 - show) * 8;
      const count = tor.slabs.length - (S.frost > 0.5 ? 1 : 0);
      tor.slabs.slice(0, count).forEach((slab, n) => {
        items.push({ key: depth(tor.x * c, tor.y) + 0.01 + n * 0.01, svg: stoneSvg(slab.ring, tor.x + slab.dx, tor.y + slab.dy, z, slab.height, c, false) });
        z += slab.height;
      });
    }
  }

  function fines(S, c, items) {
    const appear = S.frost;
    if (appear <= 0) return;
    const groups = new Map();
    for (const fine of FINES) {
      const alpha = sm(fine.born, fine.born + 0.15, appear) * (1 - sm(fine.sink, fine.sink + 0.35, S.flow));
      if (alpha < 0.04) continue;
      const z = sampleH(fine.x, fine.y, S) + 0.3;
      const key = Math.round(depth(fine.x * c, fine.y) / 6);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push([...at([fine.x * c, fine.y, z]), alpha]);
    }
    for (const [key, points] of groups) items.push({ key: key * 6 + 3, svg: k.dotsSvg(points, { size: 0.75, tone: "mid" }) });
  }

  function forest(S, c, items) {
    if (S.forest <= 0) return;
    for (const tree of TREES) {
      const grow = sm(tree.born, tree.born + 0.3, S.forest);
      if (grow <= 0) continue;
      const z = sampleH(tree.x, tree.y, S) - 0.3;
      items.push({ key: depth(tree.x * c, tree.y) + 0.03, svg: treeSvg({ ...tree, x: tree.x * c }, z, grow) });
    }
  }

  function paint(items) {
    items.sort((a, b) => a.key - b.key);
    const out = [];
    let batch = null;
    const flush = () => {
      if (!batch) return;
      out.push(`<path class="ks-c" data-m="${batch.cell}" d="${batch.d.join("")}"/>`);
      const tones = new Map();
      for (const line of batch.lines) {

        if (!tones.has(id)) tones.set(id, { ...line, d: "" });

  function endBlock(side, turn) {

    const out = [];

  function temperatureOf(S) {
    if (S.T < 4) return 18 - S.p[3] * 6;
    if (S.T < 5) return lerp(12, -6, sm(0, 0.15, S.p[4])) + 9 * Math.sin(S.p[4] * Math.PI * 2 * 7) * sm(0, 0.15, S.p[4]);

  function timeText(T) {

  function render(T) {
    const plural = (n, one, few, many) => (n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
    const S = stateOf(T);

    const items = [];
    const grid = terrain(S, c, items);
    volcanoes(S, c, items);
    tors(S, c, items);
    fines(S, c, items);
    const counts = stones(S, c, items);
    forest(S, c, items);
    const temp = temperatureOf(S);
    const svg = [
      thermometer(temp),
      endBlock(-1, -turn),
      rods(-1, jx),
      jaw(-1, jx),
      `<path class="iso-halo" style="filter:blur(5px);opacity:.25" d="${k.slabOf({ x: -X0 * c, y: -Y0, w: 2 * X0 * c, d: 2 * Y0, r: 0 }, 0, 0.1, P).fill}"/>`,
      paint(items),
      faces(S, c, grid),
      ocean(S, c, grid),
      eruptions(S, c),
      jaw(1, jx),
      rods(1, jx),
      endBlock(1, turn),
      dial(T),
    ].join("");
    const stage = Math.min(STAGE_COUNT - 1, Math.floor(T));
    const detail = [
      () => `песок ${Math.round((field(0, 0, S).h - 14) * METRES)} м · сжатие ${Math.round(S.squeeze * 100)} %`,
      () => `сжатие ${Math.round(S.squeeze * 100)} % · океан ${Math.round(oceanLevel(S).fade * 100)} %`,
      () => `высота гор ${Math.round((1 - S.pen) * 100)} % · глины ${Math.round(CLAY * S.pen * METRES)} м`,
      () => `сжатие ${Math.round(S.squeeze * 100)} % · запад +${Math.round(LIFT * S.up * METRES)} м · восток −${Math.round(DROP * S.up * METRES)} м`,
      () => `${counts.loose} ${plural(counts.loose, "глыба", "глыбы", "глыб")} · ${Math.round(temp)} °C`,
      () => `в пути ${counts.moving} · легли ${counts.settled}`,
      () => `лес ${Math.round(S.forest * 100)} % · ${Math.round(temp)} °C`,
    ][stage]();
    return { svg, stage, readout: `${timeText(T)} · ${detail}`, title: STAGES[stage].title, text: STAGES[stage].text };
  }

  return {
    render,
    STAGES,
    STAGE_COUNT,
    X0,
    Y0,
    METRES,
    TIMELINE,
    secOf,
    stateOf,
    field,
    blocks: BLOCKS,
    valley: VALLEY,
    bounds: { plate: { x: -170, y: -88, w: 340, d: 182, r: 8 }, top: 92 },
  };
}

const scene = createScene(k, P, {"intro":3.193,"stage-1":11.752,"stage-2":12.383,"stage-3":15.544,"stage-4":23.12,"stage-5":13.611,"stage-6":17.911,"stage-7":11.338} ?? undefined);
const COUNT = scene.STAGE_COUNT;
const { DUR, HOLD, INTRO, OUTRO } = scene.TIMELINE;
const TOTAL = INTRO + DUR.reduce((a, b) => a + b, 0) + OUTRO;
const Tat = (sec) => {
  let s = sec - INTRO;
  if (s <= 0) return 0;
  for (let i = 0; i < COUNT; i++) {

const secOf = scene.secOf;
const stage = document.querySelector(".iso-stage");
const group = stage.querySelector('[data-part="scene"]');
const readout = document.querySelector("[data-readout]");
const steps = [...document.querySelectorAll(".ks-step")];
const title = document.querySelector(".ks-title");

  group.innerHTML = out.svg;
  if (readout.textContent !== out.readout) readout.textContent = out.readout;

let clock = secOf(0), T = 0, target = T, touring = !still.matches, frame = 0, last = 0, visible = false, idle = 0;
function tick(now) {
